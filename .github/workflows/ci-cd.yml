
name: DevSecOps CI/CD to Amazon EKS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  JAVA_VERSION: "21"

jobs:

  # ==========================================
  # JOB 1: BUILD, TEST AND SECURITY ANALYSIS
  # ==========================================

  verify:
    name: Compile, Test and Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile and run unit tests
        working-directory: app
        run: mvn --batch-mode clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: ignore

      # OWASP dependency vulnerability scan
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: store-api
          path: .
          format: HTML
          out: dependency-check-report
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          if-no-files-found: ignore

      # Trivy filesystem scan
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # SonarCloud code quality analysis
      - name: SonarCloud analysis and quality gate
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # ==========================================
  # JOB 2: BUILD, SCAN AND PUSH DOCKER IMAGE
  # ==========================================

  build_scan_push:
    name: Build, Scan and Push Docker Image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate Docker image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t store-api:${{ steps.meta.outputs.image_tag }} .

      # Scan Docker image for vulnerabilities
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: store-api:${{ steps.meta.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Authenticate Docker to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Push SHA-tagged image to ECR
      - name: Tag and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker tag \
            "store-api:${IMAGE_TAG}" \
            "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          echo "Pushed image: ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

  # ==========================================
  # JOB 3: DEPLOY TO DEVELOPMENT EKS
  # ==========================================

  deploy_dev:
    name: Deploy to Development EKS
    needs: build_scan_push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for development
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_DEV_CLUSTER }}"

      - name: Deploy application to development
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build_scan_push.outputs.image_tag }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          kubectl create namespace dev \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|STORE_IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            deploy/base/deployment.yaml | kubectl apply -n dev -f -

          kubectl apply -n dev -f deploy/base/service.yaml

          kubectl set env deployment/store-api APP_ENV=dev -n dev

          kubectl rollout status deployment/store-api \
            -n dev --timeout=180s

          kubectl get pods,services -n dev

  # ==========================================
  # JOB 4: PRODUCTION DEPLOYMENT
  # ==========================================

  deploy_production:
    name: Promote Approved Image to Production EKS
    needs:
      - build_scan_push
      - deploy_dev

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for production
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_PROD_CLUSTER }}"

      - name: Deploy exact image tested in development
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build_scan_push.outputs.image_tag }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          kubectl create namespace prod \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|STORE_IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            deploy/base/deployment.yaml | kubectl apply -n prod -f -

          kubectl apply -n prod -f deploy/base/service.yaml

          kubectl set env deployment/store-api APP_ENV=prod -n prod

          kubectl rollout status deployment/store-api \
            -n prod --timeout=300s

          kubectl get pods,services -n prod
