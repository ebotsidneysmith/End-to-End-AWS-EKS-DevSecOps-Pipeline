
name: DevSecOps CI/CD to Amazon EKS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  JAVA_VERSION: "21"

jobs:

  # ==========================================
  # JOB 1: BUILD, TEST AND SECURITY ANALYSIS
  # ==========================================

  verify:
    name: Build, Test and Security Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JAVA 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: maven

      - name: Verify Java Installation
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          mvn -version

      # MAVEN BUILD AND TEST
      - name: Build and Run Unit Tests
        working-directory: app
        run: |
          mvn --batch-mode clean verify

      # JACOCO COVERAGE REPORT
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      # OWASP DEPENDENCY CHECK
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: dependency-check
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: "store-api"
          path: "app"
          format: "HTML"
          out: "reports"
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression /github/workspace/dependency-check-suppressions.xml

      # UPLOAD OWASP REPORT
      - name: Upload OWASP Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      # TRIVY FILESYSTEM SCAN
      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # SONARCLOUD
      - name: SonarCloud Analysis and Quality Gate
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true


  # ==========================================
  # JOB 2: DOCKER BUILD, SCAN AND PUSH TO ECR
  # ==========================================

  build_scan_push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-24.04

    needs: verify

    if: github.event_name != 'pull_request'

    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # BUILD DOCKER IMAGE
      - name: Build Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # TRIVY IMAGE SCAN
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.image_uri }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # PUSH TO ECR
      - name: Push Docker Image to Amazon ECR
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          docker push "$IMAGE_URI"
          echo "Successfully pushed: $IMAGE_URI"


  # ==========================================
  # JOB 3: DEPLOY TO DEVELOPMENT EKS
  # ==========================================

  deploy_dev:
    name: Deploy to Development EKS
    runs-on: ubuntu-24.04

    needs:
      - build_scan_push

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update Development EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ vars.EKS_DEV_CLUSTER }}"

      - name: Create Development Namespace
        run: |
          kubectl create namespace dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application to Development
        env:
          IMAGE_URI: ${{ needs.build_scan_push.outputs.image_uri }}
        run: |
          sed "s|STORE_IMAGE_PLACEHOLDER|$IMAGE_URI|g" \
            deploy/base/deployment.yaml > deployment-dev.yaml

          kubectl apply -n dev -f deployment-dev.yaml
          kubectl apply -n dev -f deploy/base/service.yaml

          kubectl set env deployment/store-api \
            APP_ENV=dev \
            -n dev

          kubectl rollout status deployment/store-api \
            -n dev \
            --timeout=300s

      - name: Verify Development Deployment
        run: |
          kubectl get deployments -n dev
          kubectl get pods -n dev
          kubectl get services -n dev


  # ==========================================
  # JOB 4: DEPLOY TO PRODUCTION EKS
  # ==========================================

  deploy_production:
    name: Deploy to Production EKS
    runs-on: ubuntu-24.04

    needs:
      - build_scan_push
      - deploy_dev

    environment:
      name: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update Production EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ vars.EKS_PROD_CLUSTER }}"

      - name: Create Production Namespace
        run: |
          kubectl create namespace prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application to Production
        env:
          IMAGE_URI: ${{ needs.build_scan_push.outputs.image_uri }}
        run: |
          sed "s|STORE_IMAGE_PLACEHOLDER|$IMAGE_URI|g" \
            deploy/base/deployment.yaml > deployment-prod.yaml

          kubectl apply -n prod -f deployment-prod.yaml
          kubectl apply -n prod -f deploy/base/service.yaml

          kubectl set env deployment/store-api \
            APP_ENV=prod \
            -n prod

          kubectl rollout status deployment/store-api \
            -n prod \
            --timeout=300s

      - name: Verify Production Deployment
        run: |
          kubectl get deployments -n prod
          kubectl get pods -n prod
          kubectl get services -n prod
